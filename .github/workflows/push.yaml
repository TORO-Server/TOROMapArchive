name: Push Archive
on:
  schedule:
    - cron: '0 19 * * *' # UTC時間で毎日午前19時 (日本時間 午前4時)
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Run Archive
        run: |
          docker compose up
      - name: Get Datetime
        env:
          TZ: 'Asia/Tokyo' # タイムゾーン指定
        run: |
          echo "CURRENT_DATETIME=$(date "+%Y-%m-%d")" >> $GITHUB_ENV
      - name: Move Files
        run: |
          sudo cp "./map/main-flat.png" "./main-flat.png"
          sudo cp "./map/flat-flat.png" "./flat-flat.png"
      - name: Configure Git user
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
      - name: Add and commit changes
        run: |
          git add .
          git commit -m "${{ env.CURRENT_DATETIME }}"
        continue-on-error: true # 変更がない場合はエラーになるので無視
      - name: Push changes
        run: |
          git push origin main
          git tag ${{ env.CURRENT_DATETIME }}
          git push origin ${{ env.CURRENT_DATETIME }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    outputs:
      datetime: ${{ env.CURRENT_DATETIME }}
  release:
    runs-on: ubuntu-latest
    needs: [build]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Get Datetime
        run: |
          echo "DATETIME=${{ needs.build.outputs.datetime }}" >> $GITHUB_ENV
      - name: Create Body
        run: |
          printf "\n## ${{ env.DATETIME }}\n" >> .github/release_body.md
      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.DATETIME }}
          body_path: .github/release_body.md
          files: |
            main-flat.png
            flat-flat.png
  pages:
    runs-on: ubuntu-latest
    needs: [build]
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: main
      - name: Install ImageMagick
        run: |
          sudo apt-get update
          sudo apt-get install -y imagemagick
      - name: Setup Cobol
        uses: fabasoad/setup-cobol-action@v1
      - name: Create Images
        run: |
          mkdir dist
          cd dist
          cp "../main-flat.png" "./main-flat.png"
          cp "../flat-flat.png" "./flat-flat.png"
          convert "./main-flat.png" -resize 2048x2048 "./main-flat-2048.png"
          convert "./flat-flat.png" -resize 2048x2048 "./flat-flat-2048.png"
      - name: Create Site
        run: |
          cobc -x ./GEN-SITE.CBL
          cd dist
          ls | grep -E '\.(jpg|jpeg|png|gif)$' > FILE-LIST.DAT
          ../GEN-SITE
          rm FILE-LIST.DAT
      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
permissions:
  contents: write
